name: Playwright Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        
      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        env:
          STONEWAKE_APP_URL: https://app.stonewake.ai
          STONEWAKE_API_URL: https://api.stonewake.ai
          STONEWAKE_EMAIL: ${{ secrets.STONEWAKE_EMAIL }}
          STONEWAKE_PASSWORD: ${{ secrets.STONEWAKE_PASSWORD }}
          STONEWAKE_API_KEY: ${{ secrets.STONEWAKE_API_KEY }}
        run: npm run test:ci

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
